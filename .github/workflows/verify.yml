name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The build derives its version from git tags and records the source commit.
          fetch-depth: 0

      # The Java toolchain is pinned to 17 (--release 8 via Jabel); Checkstyle runs on 25.
      - name: Set up JDK 17 toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up JDK 25 (Gradle runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Register installed JDKs for Gradle toolchain detection
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for version in 17 25; do
            var="JAVA_HOME_${version}_X64"
            path="${!var:-}"
            if [ -n "$path" ]; then
              paths+=("$path")
            fi
          done
          if [ "${#paths[@]}" -gt 0 ]; then
            joined=$(IFS=,; echo "${paths[*]}")
            echo "org.gradle.java.installations.paths=$joined" >> "$HOME/.gradle/gradle.properties"
            echo "Registered toolchains: $joined"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      # Some regression suites touch client-side classes under an X server even when headless.
      - name: Install Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb mesa-utils x11-xserver-utils

      - name: Build and run verification checks
        # `build` covers compilation, JUnit, the hand-written JavaExec regressions,
        # the license bundle check, tests and reobfuscated-ABI checks.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" ./gradlew build --build-cache --stacktrace --console=plain

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gtmb-jars
          path: build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
            build/hologram-*/
          if-no-files-found: ignore
          retention-days: 14
